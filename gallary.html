    <script>function list(){
        // var humb =document.querySelector(".humburger");
        var hamburger = document.querySelector(".hamburger");
        var nav =document.querySelector(".navbar");
        var hdown=document.querySelector(".container");
        nav.classList.toggle("down");
        hamburger.classList.toggle("is-active");
        hdown.classList.toggle("hdown");
    }
    
    // Image Viewer Variables
    let currentImageIndex = 0;
    let allImages = [];
    let currentZoom = 1;
    let lastTouchDistance = 0;
    let panX = 0;
    let panY = 0;
    let mouseX = 0;
    let mouseY = 0;
    let isDragging = false;
    let dragStartX = 0;
    let dragStartY = 0;
    let dragStartPanX = 0;
    let dragStartPanY = 0;
    
    // Initialize Image Viewer
    document.addEventListener('DOMContentLoaded', function() {
        initializeImageViewer();
    });
    
    function initializeImageViewer() {
        // Collect all images from gallery
        const imageElements = document.querySelectorAll('.image-container .image img');
        allImages = Array.from(imageElements).map(img => img.src);
        
        // Add click listeners to all images
        imageElements.forEach((img, index) => {
            img.addEventListener('click', function() {
                openImageViewer(index);
            });
        });
        
        // Setup keyboard navigation
        document.addEventListener('keydown', handleKeyPress);
        
        // Setup mouse wheel zoom
        document.getElementById('imageViewerContainer')?.addEventListener('wheel', handleZoom);
        
        // Track mouse movement for zoom
        document.addEventListener('mousemove', function(e) {
            const viewer = document.getElementById('imageViewerContainer');
            if (viewer && viewer.style.display === 'flex') {
                const rect = document.getElementById('viewerImage').getBoundingClientRect();
                mouseX = e.clientX - rect.left - rect.width / 2;
                mouseY = e.clientY - rect.top - rect.height / 2;
                
                // Handle dragging
                if (isDragging) {
                    const deltaX = e.clientX - dragStartX;
                    const deltaY = e.clientY - dragStartY;
                    panX = dragStartPanX + deltaX/3;
                    panY = dragStartPanY + deltaY/3;
                    document.getElementById('viewerImage').style.transform = `scale(${currentZoom}) translate(${panX}px, ${panY}px)`;
                }
            }
        });
        
        // Mouse down - start dragging
        document.addEventListener('mousedown', function(e) {
            const viewer = document.getElementById('imageViewerContainer');
            if (viewer.style.display !== 'flex') return;
            if (currentZoom <= 1) return; // Only drag when zoomed
            
            const viewerImg = document.getElementById('viewerImage');
            if (viewerImg.contains(e.target)) {
                isDragging = true;
                dragStartX = e.clientX;
                dragStartY = e.clientY;
                dragStartPanX = panX;
                dragStartPanY = panY;
                viewerImg.style.cursor = 'grabbing';
            }
        });
        
        // Mouse up - stop dragging
        document.addEventListener('mouseup', function() {
            isDragging = false;
            const viewerImg = document.getElementById('viewerImage');
            if (viewerImg) {
                viewerImg.style.cursor = currentZoom > 1 ? 'grab' : 'default';
            }
        });
        
        // Mouse leave window - stop dragging
        document.addEventListener('mouseleave', function() {
            isDragging = false;
        });
    }
    
    function openImageViewer(index) {
        currentImageIndex = index;
        currentZoom = 1;
        panX = 0;
        panY = 0;
        const viewer = document.getElementById('imageViewerContainer');
        const viewerImg = document.getElementById('viewerImage');
        
        viewer.style.display = 'flex';
        viewerImg.src = allImages[index];
        viewerImg.style.transform = `scale(${currentZoom}) translate(${panX}px, ${panY}px)`;
        document.body.style.overflow = 'hidden';
        
        // Update image counter
        document.getElementById('currentImageNumber').textContent = index + 1;
        document.getElementById('totalImages').textContent = allImages.length;
        document.getElementById('zoomPercentage').textContent = '100%';
    }
    
    function closeImageViewer() {
        const viewer = document.getElementById('imageViewerContainer');
        viewer.style.display = 'none';
        document.body.style.overflow = 'auto';
        currentZoom = 1;
    }
    
    function nextImage() {
        currentImageIndex = (currentImageIndex + 1) % allImages.length;
        currentZoom = 1;
        panX = 0;
        panY = 0;
        document.getElementById('viewerImage').src = allImages[currentImageIndex];
        document.getElementById('viewerImage').style.transform = `scale(${currentZoom}) translate(${panX}px, ${panY}px)`;
        document.getElementById('currentImageNumber').textContent = currentImageIndex + 1;
        document.getElementById('zoomPercentage').textContent = '100%';
    }
    
    function prevImage() {
        currentImageIndex = (currentImageIndex - 1 + allImages.length) % allImages.length;
        currentZoom = 1;
        panX = 0;
        panY = 0;
        document.getElementById('viewerImage').src = allImages[currentImageIndex];
        document.getElementById('viewerImage').style.transform = `scale(${currentZoom}) translate(${panX}px, ${panY}px)`;
        document.getElementById('currentImageNumber').textContent = currentImageIndex + 1;
        document.getElementById('zoomPercentage').textContent = '100%';
    }
    
    function handleZoom(event) {
        event.preventDefault();
        const zoomSpeed = 0.1;
        const maxZoom = 4;
        const minZoom = 1;
        
        const viewerContainer = document.getElementById('imageViewerContainer');
        const viewerImg = document.getElementById('viewerImage');
        const rect = viewerImg.getBoundingClientRect();
        
        // Get mouse position relative to the image
        mouseX = event.clientX - rect.left - rect.width / 2;
        mouseY = event.clientY - rect.top - rect.height / 2;
        
        const oldZoom = currentZoom;
        
        if (event.deltaY < 0) {
            // Zoom in
            currentZoom = Math.min(currentZoom + zoomSpeed, maxZoom);
        } else {
            // Zoom out
            currentZoom = Math.max(currentZoom - zoomSpeed, minZoom);
        }
        
        // Adjust pan to zoom towards cursor
        const zoomDiff = currentZoom - oldZoom;
        panX -= (mouseX / rect.width) * rect.width * zoomDiff / oldZoom;
        panY -= (mouseY / rect.height) * rect.height * zoomDiff / oldZoom;
        
        // Apply transform
        viewerImg.style.transform = `scale(${currentZoom}) translate(${panX}px, ${panY}px)`;
        document.getElementById('zoomPercentage').textContent = Math.round(currentZoom * 100) + '%';
    }
    
    function handleKeyPress(event) {
        const viewer = document.getElementById('imageViewerContainer');
        if (viewer.style.display !== 'flex') return;
        
        if (event.key === 'ArrowRight') nextImage();
        if (event.key === 'ArrowLeft') prevImage();
        if (event.key === 'Escape') closeImageViewer();
    }
    
    // Touch support for mobile pinch zoom
    document.addEventListener('touchstart', function(e) {
        if (e.touches.length === 2) {
            lastTouchDistance = getTouchDistance(e.touches[0], e.touches[1]);
        } else if (e.touches.length === 1 && currentZoom > 1) {
            // Single touch for dragging when zoomed
            isDragging = true;
            dragStartX = e.touches[0].clientX;
            dragStartY = e.touches[0].clientY;
            dragStartPanX = panX;
            dragStartPanY = panY;
        }
    });
    
    document.addEventListener('touchmove', function(e) {
        const viewer = document.getElementById('imageViewerContainer');
        if (viewer.style.display !== 'flex') return;
        
        if (e.touches.length === 2) {
            // Pinch zoom
            e.preventDefault();
            const touchDistance = getTouchDistance(e.touches[0], e.touches[1]);
            const diff = touchDistance - lastTouchDistance;
            const zoomSpeed = 0.01;
            const maxZoom = 4;
            const minZoom = 1;
            
            if (diff > 0) {
                currentZoom = Math.min(currentZoom + zoomSpeed, maxZoom);
            } else {
                currentZoom = Math.max(currentZoom - zoomSpeed, minZoom);
            }
            
            document.getElementById('viewerImage').style.transform = `scale(${currentZoom}) translate(${panX}px, ${panY}px)`;
            document.getElementById('zoomPercentage').textContent = Math.round(currentZoom * 100) + '%';
            lastTouchDistance = touchDistance;
        } else if (e.touches.length === 1 && isDragging && currentZoom > 1) {
            // Single touch drag when zoomed
            e.preventDefault();
            const deltaX = e.touches[0].clientX - dragStartX;
            const deltaY = e.touches[0].clientY - dragStartY;
            panX = dragStartPanX + deltaX;
            panY = dragStartPanY + deltaY;
            document.getElementById('viewerImage').style.transform = `scale(${currentZoom}) translate(${panX}px, ${panY}px)`;
        }
    });
    
    document.addEventListener('touchend', function() {
        isDragging = false;
    });
    
    function getTouchDistance(touch1, touch2) {
        const dx = touch1.clientX - touch2.clientX;
        const dy = touch1.clientY - touch2.clientY;
        return Math.sqrt(dx * dx + dy * dy);
    }
    </script>

 .hamburger {
    margin: 0 30px;
              cursor: pointer;
    display: inline-block;
    transition-property: opacity, filter;
    transition-duration: 0.15s;
    transition-timing-function: linear;
    text-transform: none;
    background-color: transparent;
    border: 0;
    overflow: visible; 
  }
    
    .hamburger.is-active .hamburger-inner,
    .hamburger.is-active .hamburger-inner::before,
    .hamburger.is-active .hamburger-inner::after {
      background-color: #2bd9ce; }
  
  .hamburger-box {
    width: 30px;
    height: 24px;
    display: inline-block;
    position: relative; }
  
  .hamburger-inner {
    display: block;
    top: 50%;
    margin-top: -2px; }
    .hamburger-inner, .hamburger-inner::before,
     .hamburger-inner::after {
      width: 30px;
      height: 3.5px;
      background-color: #08e17c;
      border-radius: 4px;
      position: absolute;
      transition-property: transform;
      transition-duration: 0.5s;
      transition-timing-function: ease; }
    .hamburger-inner::before, .hamburger-inner::after {
      content: "";
      display: block; }
    .hamburger-inner::before {
      top: -10px; }
    .hamburger-inner::after {
      bottom: -10px; }
  
      /* end .hamburger */
      /* Emphatic
     */
  .hamburger--emphatic {
    overflow: visible; }
    .hamburger--emphatic .hamburger-inner {
      transition: background-color 0.125s 0.175s ease-in; }
      .hamburger--emphatic .hamburger-inner::before {
        left: 0;
        transition: transform 0.125s cubic-bezier(0.6, 0.04, 0.98, 0.335), top 0.05s 0.125s linear, left 0.125s 0.175s ease-in; }
      .hamburger--emphatic .hamburger-inner::after {
        top: 10px;
        right: 0;
        transition: transform 0.125s cubic-bezier(0.6, 0.04, 0.98, 0.335), top 0.05s 0.125s linear, right 0.125s 0.175s ease-in; }
    .hamburger--emphatic.is-active .hamburger-inner {
      transition-delay: 0s;
      transition-timing-function: ease-out;
      background-color: transparent !important; }
      .hamburger--emphatic.is-active .hamburger-inner::before {
        left: -80px;
        top: -80px;
        transform: translate3d(80px, 80px, 0) rotate(45deg);
        transition: left 0.125s ease-out, top 0.05s 0.125s linear, transform 0.125s 0.175s cubic-bezier(0.075, 0.82, 0.165, 1); 
    }
      .hamburger--emphatic.is-active .hamburger-inner::after {
        right: -80px;
        top: -80px;
        transform: translate3d(-80px, 80px, 0) rotate(-45deg);
        transition: right 0.125s ease-out, top 0.05s 0.125s linear, transform 0.125s 0.175s cubic-bezier(0.075, 0.82, 0.165, 1); 
      }

/* ============ IMAGE VIEWER STYLES ============ */

.image-viewer-overlay {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0, 0, 0, 0.95);
  z-index: 10000;
  align-items: center;
  justify-content: center;
  backdrop-filter: blur(5px);
  animation: fadeIn 0.3s ease-in;
}

@keyframes fadeIn {
  from {
    opacity: 0;
  }
  to {
    opacity: 1;
  }
}

.image-viewer-wrapper {
  position: relative;
  width: 90%;
  height: 90%;
  display: flex;
  align-items: center;
  justify-content: center;
}

.image-viewer-content {
  position: relative;
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  border-radius: 10px;
}

.viewer-image {
  max-width: 100%;
  max-height: 100%;
  object-fit: contain;
  transition: transform 0.1s ease-out;
  cursor: grab;
  user-select: none;
  -webkit-user-drag: none;
  transform-origin: center center;
  will-change: transform;
}

.viewer-image:active {
  cursor: grabbing;
}

.viewer-image.draggable {
  cursor: grab;
}

.viewer-image.dragging {
  cursor: grabbing;
}

/* Navigation Arrows */
.nav-arrow {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  background: rgba(255, 255, 255, 0.2);
  color: white;
  border: none;
  font-size: 40px;
  padding: 15px 20px;
  cursor: pointer;
  z-index: 10001;
  border-radius: 50%;
  width: 60px;
  height: 60px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.3s ease;
}

.nav-arrow:hover {
  background: rgba(255, 255, 255, 0.4);
  transform: translateY(-50%) scale(1.1);
}

.nav-arrow:active {
  transform: translateY(-50%) scale(0.95);
}

.left-arrow {
  left: 20px;
}

.right-arrow {
  right: 20px;
}

/* Close Button */
.close-viewer {
  position: absolute;
  top: 20px;
  right: 20px;
  background: rgba(255, 255, 255, 0.2);
  color: white;
  border: none;
  font-size: 40px;
  width: 60px;
  height: 60px;
  cursor: pointer;
  z-index: 10002;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.3s ease;
  padding: 0;
  line-height: 1;
}

.close-viewer:hover {
  background: rgba(255, 0, 0, 0.4);
  transform: scale(1.1);
}

.close-viewer:active {
  transform: scale(0.95);
}

/* Image Counter */
.image-counter {
  position: absolute;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(255, 255, 255, 0.2);
  color: white;
  padding: 10px 20px;
  border-radius: 25px;
  font-size: 14px;
  z-index: 10001;
  backdrop-filter: blur(5px);
}

/* Zoom Info */
.zoom-info {
  position: absolute;
  bottom: 80px;
  right: 20px;
  background: rgba(0, 0, 0, 0.5);
  color: white;
  padding: 10px 15px;
  border-radius: 10px;
  font-size: 12px;
  z-index: 10001;
  backdrop-filter: blur(5px);
  display: flex;
  flex-direction: column;
  gap: 5px;
  text-align: center;
}

.zoom-percentage {
  font-size: 16px;
  font-weight: bold;
  color: #00ff8c;
}

.zoom-hint {
  font-size: 11px;
  opacity: 0.8;
}

/* Mobile Responsive */
@media (max-width: 768px) {
  .image-viewer-wrapper {
    width: 95%;
    height: 95%;
  }
  
  .nav-arrow {
    width: 50px;
    height: 50px;
    font-size: 30px;
    padding: 10px 15px;
  }
  
  .left-arrow {
    left: 10px;
  }
  
  .right-arrow {
    right: 10px;
  }
  
  .close-viewer {
    width: 50px;
    height: 50px;
    font-size: 30px;
    top: 10px;
    right: 10px;
  }
  
  .image-counter {
    bottom: 10px;
    font-size: 12px;
    padding: 8px 15px;
  }
  
  .zoom-info {
    bottom: 60px;
    right: 10px;
    font-size: 10px;
  }
  
  .zoom-percentage {
    font-size: 14px;
  }
  
  .zoom-hint {
    display: none;
  }
}

@media (max-width: 480px) {
  .nav-arrow {
    width: 45px;
    height: 45px;
    font-size: 24px;
  }
  
  .close-viewer {
    width: 45px;
    height: 45px;
    font-size: 26px;
  }
  
  .image-counter {
    font-size: 11px;
  }
}
